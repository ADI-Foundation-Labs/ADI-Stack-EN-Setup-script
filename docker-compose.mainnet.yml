services:
  proof-sync:
    image: peterdavehello/azcopy:latest
    container_name: ${CONTAINER_PREFIX:-adi_mainnet}_proof_sync
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/sync-proofs.sh"]
    environment:
      PROOF_STORAGE_URL: "${PROOF_STORAGE_URL:-https://adimainnet.blob.core.windows.net/proofs}"
      SHARED_PROOF_DIR: "/chain/db/shared"
      SYNC_INTERVAL: "${PROOF_SYNC_INTERVAL:-60}"
      DELETE_DESTINATION: "${PROOF_SYNC_DELETE:-false}"
    volumes:
      - ${CHAIN_DATA_DIR:-./mainnet_data}:/chain
      - ./sync-proofs.sh:/sync-proofs.sh:ro
    networks:
      - zkos-net

  external_node:
    image: ghcr.io/adi-foundation-labs/server:${EN_VERSION:-v0.20.12-b1}
    container_name: ${CONTAINER_PREFIX:-adi_mainnet}_external_node
    restart: unless-stopped
    working_dir: /app
    environment:
      genesis_bridgehub_address: "${BRIDGEHUB_ADDRESS:-0x7a38c18a229ef8a0ae7104ba272a46280f2d59cb}"
      genesis_bytecode_supplier_address: "${BYTECODE_SUPPLIER_ADDRESS:-0x6e369e616dd5a5cb0cd410f541c784033de89042}"
      genesis_chain_id: "${CHAIN_ID:-36900}"
      general_main_node_rpc_url: "${MAIN_RPC_URL:-https://rpc.adifoundation.ai}"
      general_rocks_db_path: "/chain/db/node1"
      prover_api_object_store_file_backed_base_path: "/chain/db/shared"
      sequencer_block_dump_path: "/chain/db/node1/block_dumps"
      rpc_address: "0.0.0.0:3050"
      status_server_address: "0.0.0.0:3071"
      observability_prometheus_port: "3312"
      general_l1_rpc_url: "${GENERAL_L1_RPC_URL}"
      genesis_genesis_input_path: "/genesis/genesis.json"
      general_node_role: "external"
      network_enabled: "true"
      network_secret_key: "${EXTERNAL_NETWORK_SECRET_KEY}"
      network_boot_nodes: "${BOOT_NODE_URLS}"
      RUST_LOG: "info,zksync_os_server=info,zksync_os_sequencer=info,zksync_os_merkle_tree=info,zksync_os_priority_tree=info,zksync_os_server::prover_api=info"
    volumes:
      - ${CHAIN_DATA_DIR:-./mainnet_data}:/chain
      - ./genesis/mainnet.json:/genesis/genesis.json:ro
    ports:
      - "3050:3050"
      - "3071:3071"
      - "3054:3054"
      - "3312:3312"
    networks:
      - zkos-net

networks:
  zkos-net:
    driver: bridge
